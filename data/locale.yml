# AddressLookup function signatures.
# f = position in Etherscan's alphabetically-sorted function list.
# Notes:
#   - `make` and `made` are overloaded in v3.0.0 (low-level `(bytes,uint256)`
#     and `(bytes32,uint256)` variants inherited from Prototype plus the
#     high-level `(Entry[],uint256)` variant declared on AddressLookup).
#     Etherscan lists each overload separately, sorted by full signature
#     string. The F# indices for the overloaded entries are noted but need
#     visual confirmation on the verified Etherscan page.
#   - `zzInit` is `onlyProto` — reachable only from the Prototype itself.
#     It is included under `write:` because Etherscan lists it on the
#     Write Contract tab as a non-view function.

# BLK-4 resolved: the current AddressLookup prototype is the one the live
# Locale clones (USDC, PoolManagerLookup — see data/uniswap-lookup.yml) are
# deployed from. The legacy 0x6adD49A7… prototype is superseded.
address: "0xaDDb841F7f2D4176C480E3734448047ad83FE300"

write:
  "make(bytes,uint256)":
    f: 1  # TODO: confirm overloaded F# on verified Etherscan page
    description: "Low-level: deploy a clone from the raw ABI-encoded args"
  "make((uint256,address)[],uint256)":
    f: 2  # TODO: confirm overloaded F# on verified Etherscan page
    description: "Deploy a new AddressLookup with chain-specific entries"
  "zzInit(bytes,uint256)":
    f: 3
    description: "onlyProto initializer; stores the entry matching block.chainid"

read:
  "encode((uint256,address)[])":
    f: 1
    description: "ABI-encode entries to derive the deterministic clone address"
  "made(bytes,uint256)":
    f: 2  # TODO: confirm overloaded F# on verified Etherscan page
    description: "Low-level: check existence and preview address from raw args"
  "made(bytes32,uint256)":
    f: 3  # TODO: confirm overloaded F# on verified Etherscan page
    description: "Low-level: check existence and preview address from argshash"
  "made((uint256,address)[],uint256)":
    f: 4  # TODO: confirm overloaded F# on verified Etherscan page
    description: "Check if a lookup exists and preview its address"
  "proto()":
    f: 5
    description: "Prototype (factory) address used as the clone implementation"
  "value()":
    f: 6
    description: "The chain-specific address resolved for this lookup"
  "version()":
    f: 7
    description: "Contract version string"

# StringLookup prototype — the IStringLookup sibling of AddressLookup
# (chain id → string). Reflector reads a clone of it (GasNameLookup, see
# data/uniswap-lookup.yml) at construction to derive the native-pair symbol.
stringLookup:
  name: "StringLookup"
  description: "Locale prototype mapping chain id → string. Deploys clones
    such as GasNameLookup; Reflector uses one to resolve the chain-local
    native-token symbol."
  address: "0x555F0018a30F59634af07589ed17f44DF2BCE300"
