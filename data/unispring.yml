# Unispring contract addresses and function signatures.
# Reflector, Fountain, and the USDCReflector clone are deployed; the
# Manifold / NeutrinoSource / NeutrinoChannel / Hub stack is not yet
# deployed (addresses left blank until launch).
# `f` = position in Etherscan's alphabetically-sorted function list.

# Per-contract entries. Each has the same shape: address + optional write/read maps.

fountain:
  name: "Fountain"
  description: "Owns every Unispring V4 position. Forwards swap fees to taker; no
    decrease-liquidity path."
  address: "0xF00c0C30CE13f01c77C1F8d60Fc1146014B4E090"
  write:
    "offer(token, quote, ticks, amounts)":
      f: 1
      description: "Lock liquidity: pull `token` from the caller and open one
        permanent V4 position per tick segment of the caller-described
        curve. Principal can never be withdrawn — only swap fees."
    "take(ids)":
      f: 3
      description: "Sweep accrued swap fees from a batch of Fountain-owned
        positions into Fountain's balance. Permissionless."
    "unlockCallback(data)":
      f: 5
      description: "Uniswap V4 unlock callback. PoolManager-only;
        selector-dispatches the original offer/take call. Not called
        directly."
    "withdraw(currency, amount)":
      f: 6
      description: "Owner-only. Forward collected fees (and any starter
        funds sent in for flipped-case bootstraps) to the Fountain owner."
  read:
    "fee()":
      f: 1
      description: "Fixed pool fee applied to every position: 0.01% (100)."
    "owner()":
      f: 2
      description: "The address swept swap fees are forwarded to via
        `withdraw`."
    "poolManager()":
      f: 3
      description: "Chain-local Uniswap V4 PoolManager this Fountain opens
        positions on."
    "positions(index)":
      f: 4
      description: "Position record at `index` (currency0/1, fee,
        tickSpacing, tickLower/Upper), in creation order."
    "positionsCount()":
      f: 5
      description: "Number of positions opened by this Fountain."
    "positionsSlice(offset, count)":
      f: 6
      description: "Bulk-read `count` positions starting at `offset`."
    "tickSpacing()":
      f: 7
      description: "Fixed tick spacing: 1 (exact tick precision)."
    "untaken(ids)":
      f: 8
      description: "Swap fees accrued but not yet swept for the given
        position ids — returns (amounts0, amounts1)."
    "version()":
      f: 9
      description: "Contract version string."

manifold:
  name: "Manifold (prototype)"
  description: "Per-(hub, tickLower, tickUpper) clone factory. Calls Fountain to
    seat positions."
  address:
  write:
    "make(hub, tickLower, tickUpper)":
      f: 1
      description: "Deploy (or return) the deterministic Manifold clone for
        `(hub, tickLower, tickUpper)`. Idempotent."
    "offer(token, supply, tickLower, tickUpper)":
      f: 2
      description: "Lock `supply` of `token` into a single-sided permanent
        V4 position paired against the hub (or ETH when `token` is the
        hub). Permissionless and re-callable."
    "zzInit(hub, tickLower, tickUpper)":
      f: 3
      description: "Clone initializer. Sets the hub and seeds its ETH pool
        from the hub balance held at the clone. Proto-only."
  read:
    "hub()":
      f: 1
      description: "The hub token this clone pairs spokes against."
    "made(hub, tickLower, tickUpper)":
      f: 2
      description: "Predict the deterministic clone address and whether it
        exists — returns (exists, home, salt)."
    "placer()":
      f: 3
      description: "The Fountain that holds every position funded through
        this Manifold; accrued fees flow to its owner."
    "proto()":
      f: 4
      description: "The prototype instance that acts as the clone factory."
    "version()":
      f: 5
      description: "Contract version string."

neutrinoSource:
  name: "NeutrinoSource (prototype)"
  description: "Mints a Lepton spoke and hands it to a Manifold clone for funding."
  address:
  write:
    "launch(name, symbol, decimals, supply, salt, tickLower, tickUpper)":
      f: 1
      description: "One-call fair launch: mint a spoke token and lock its
        entire supply as a permanent single-sided pool against this
        clone's hub. Permissionless; caller pays gas, no pre-mint."
    "make(name, symbol, decimals, supply, tickLower, tickUpper, tokenSalt, variant)":
      f: 2
      description: "Create a hub token, its Manifold clone, and a
        NeutrinoSource clone that bundles them. Idempotent."
    "zzInit(args)":
      f: 4
      description: "Clone initializer. Stores the Manifold clone (`spring`)
        for this clone's hub. Proto-only."
  read:
    "channelProto()":
      f: 1
      description: "The NeutrinoChannel prototype cloned per tick range so
        each range mints at a distinct token address."
    "coinage()":
      f: 2
      description: "The Coinage prototype used to mint hub and spoke tokens."
    "hub()":
      f: 4
      description: "This clone's hub token, derived from `spring`."
    "made(name, symbol, decimals, supply, tickLower, tickUpper, tokenSalt, variant)":
      f: 6
      description: "Predict the deterministic clone address, salt, and
        hub-token address before calling `make` — returns
        (exists, home, salt, hubHome)."
    "proto()":
      f: 8
      description: "The prototype instance that acts as the clone factory."
    "spring()":
      f: 9
      description: "The Manifold clone for this clone's hub."
    "springProto()":
      f: 10
      description: "The Manifold prototype used to create fair-launch pools."
    "version()":
      f: 11
      description: "Contract version string."

neutrinoChannel:
  name: "NeutrinoChannel (prototype)"
  description: "Relays a single Coinage.make() call per clone."
  address:
  write:
    "make(tickLower, tickUpper, variant)":
      f: 1
      description: "Deploy (or return) the caller's deterministic relay
        clone for a tick range and salt variant. Idempotent."
    "mint(minter, name, symbol, decimals, supply, salt)":
      f: 3
      description: "Source-only. Mint a token through Coinage and forward
        the entire supply to the caller. The tick-keyed clone address
        gives each tick range a distinct minted-token address."
    "zzInit(args)":
      f: 4
      description: "Clone initializer. Records the creating `source`.
        Proto-only."
  read:
    "made(sender, tickLower, tickUpper, variant)":
      f: 3
      description: "Predict the deterministic clone address for
        `(sender, tickRange, variant)` — returns (exists, home, salt)."
    "proto()":
      f: 5
      description: "The prototype instance that acts as the clone factory."
    "source()":
      f: 6
      description: "The address that created this clone and the only caller
        allowed to invoke `mint`."
    "version()":
      f: 7
      description: "Contract version string."

reflector:
  name: "Reflector (prototype)"
  description: "Two-level signature-token factory. The prototype mints
    clones keyed by (peg, symbol); each clone mints signature tokens —
    one per name — pegged 1:1 against its peg inside a hard 1-bp
    corridor. The prototype itself is the canonical clone for the native
    pair, whose symbol is resolved at construction from a chain-local
    IStringLookup (\"1xETH\" on mainnet, \"1xMATIC\" on Polygon, etc.)."
  # Reflector bytecode differs from earlier Notable/Mimicry revisions,
  # so its CREATE2 address differs too. Vanity-mined and deployed via
  # Nick.
  address: "0xBdbDe564c4e4dEA7E98BAFa4733fE41158E2e091"
  # `f` values are positions on the live, verified peg contract.
  # Read gaps (F2 encode, F5 made(bytes,…), F6 made(bytes32,…)) and the
  # write gap (F3 make(bytes,…)) are inherited Prototype plumbing left
  # undocumented, same convention as liquid.yml.
  write:
    "issue(name, supply, variant)":
      f: 1
      description: "Mint a fresh signature-token ERC-20 with this clone's
        stored (peg, symbol) and seat its entire `supply` as a single-tick V4
        position at price 1. `supply` is the raw token amount to mint —
        caller-chosen and capped at `maxSupply` (reverts above it) — and is
        mixed into the token's address salt. Idempotent per (name, supply,
        variant). Callable on the prototype to mint native-pair signature
        tokens, or on any clone to mint signature tokens under that pair.
        `variant` is a vanity-mining nonce — pass `0` unless you're
        reproducing a specific committed prediction."
    "make(peg, symbol, variant)":
      f: 2
      description: "Deploy (or return) the deterministic Reflector clone for
        (peg, symbol). Pass an IAddressLookup as `peg` to mirror a
        chain-local token while keeping the same clone address across
        chains. Returns the prototype itself for the native pair.
        `variant` is a vanity-mining nonce — pass `0` unless you're
        reproducing a specific committed prediction."
    "zzInit(args)":
      f: 4
      description: "Clone initializer. Decodes and records (peg, symbol) on
        a freshly deployed clone. Proto-only; reverts on the reserved
        native pair."
  read:
    "coinage()":
      f: 1
      description: "The Coinage factory used to mint signature-token
        ERC-20s."
    "issued(name, supply, variant)":
      f: 3
      description: "Predict the deterministic signature-token address for
        `name` at `supply` under this instance's stored (peg, symbol).
        `supply` is part of the address salt, so the same `name` at a
        different supply predicts a different address. `variant` is a
        vanity-mining nonce — pass `0` unless you're reproducing a
        specific committed prediction."
    "made(peg, symbol, variant)":
      f: 4
      description: "Predict the deterministic address (and existence) of a
        clone for (peg, symbol) before calling `make`. Returns the
        prototype's own address for the native pair. `variant` is a
        vanity-mining nonce — pass `0` unless you're reproducing a
        specific committed prediction."
    "maxSupply()":
      f: 7
      description: "Hard cap on the `supply` a caller may request through
        `issue` — sized to fit V4's maxLiquidityPerTick for a single-tick
        seat at tickSpacing 1 (9×10^27 raw, ~9 billion at 18 decimals). Any
        supply at or below it is guaranteed to land in the pool."
    "peg()":
      f: 8
      description: "The currency every signature token minted by this
        instance is pegged 1:1 against (address(0) for native ETH). The
        prototype's value is native ETH."
    "placer()":
      f: 9
      description: "The Fountain that holds each signature token's
        single-tick position and routes its swap fees to the Fountain
        owner."
    "proto()":
      f: 10
      description: "The prototype instance that acts as the clone factory."
    "symbol()":
      f: 11
      description: "The symbol shared by every signature token minted by
        this instance. The prototype resolves its value from a chain-local
        IStringLookup at construction (e.g. \"1xETH\" on mainnet)."
    "version()":
      f: 12
      description: "Contract version string."

  # Known clones. Each entry is itself a (peg, symbol) factory whose
  # `issue(name, supply, variant)` mints a signature-token ERC-20 sharing this
  # symbol and pegged against this peg.
  #
  # Each signature token's `variant` is the vanity-mining nonce that
  # produced its address, with leading zeros trimmed — the form the
  # Reflector dapp expects in its `variant=` deep-link param. The full
  # 32-byte value lives in unispring/io/<Name>/<addr>.yml.
  clones:
    1xETH:
      symbol: "1xETH"
      peg: "native ETH"
      address: "0xBdbDe564c4e4dEA7E98BAFa4733fE41158E2e091"
      note: "On mainnet the prototype itself is the canonical native-pair
        clone — no separate deploy. The pair's symbol is resolved at
        construction from a chain-local IStringLookup (\"1xETH\" on
        mainnet, \"1xMATIC\" on Polygon, etc.)."
      # First entry is the flagship showcase token, Uniteum Ether (the
      # /reflector/uniteum-1xeth/ page links here). All are signature
      # tokens issued by the Reflector prototype against native ETH —
      # see unispring/io/<Name>/.
      signatures:
        - name: "Uniteum Ether"
          address: "0x11111C73C5c678bf3F58d5F51541DAB586835e74"
          variant: "0x81213112"
          permalink: "/reflector/uniteum-1xeth/"
        - name: "Bitsy ETH"
          address: "0xB1754a2737c9A3ED9d6388Ec995C688c9910fe74"
          variant: "0x410222f3"
        - name: "Gift ETH"
          address: "0x61F7A1906fafeb0d2377FFbfb5c6Ee4AaC838e74"
          variant: "0x79117bc"
    1xUSDC:
      symbol: "1xUSDC"
      peg: "chain-local USDC (resolved via USDCLookup)"
      peg_lookup: "USDCLookup"
      peg_lookup_address: "0xC5DC3461ed6653dbC5E6A8bCDcF0354fF178E300"
      address: "0x05dd500b6f582Db818Dd0B44F4345963f4a0d13D"
      note: "Made by the prototype with USDCLookup as `peg`, so the
        same clone address resolves on every chain that has a
        USDCLookup. Deploys on first make()/issue()."
      # First entry is the flagship showcase token, Uniteum Dollar. All
      # are signature tokens issued by the USDCReflector clone against
      # chain-local USDC — see unispring/io/<Name>/.
      signatures:
        - name: "Uniteum Dollar"
          address: "0x11111F29eB65327920fcAaC54bf98b66Ed2C1C5d"
          variant: "0x1dfb83db67"
          permalink: "/reflector/uniteum-1xusdc/"
        - name: "Cafe"
          address: "0xcaFedcCd70AE9D9776FFD582b9355f30A797cafe"
          variant: "0x1d4604241"
        - name: "Dad"
          address: "0xDad0302B8b62fe5630f01E283f3654a0CeB30dad"
          variant: "0x2e762cc5"
        - name: "Dadda"
          address: "0xdAdDa344d8EA5c096DB1BbBC0564459fe79daDDa"
          variant: "0x9c0694382b"
        - name: "Good Food"
          address: "0x600d59802da5F7ac7FaFdD562c2fe09397f2f00d"
          variant: "0x46dd9c90"
        - name: "Momma"
          address: "0x3033A6950603E93395E926EdFCD10388eBf3033A"
          variant: "0x536798405f"
    USA250:
      symbol: "USA250"
      peg: "chain-local USDC (resolved via USDCLookup)"
      peg_lookup: "USDCLookup"
      peg_lookup_address: "0xC5DC3461ed6653dbC5E6A8bCDcF0354fF178E300"
      address: "0x1776eFbe669dA18608a8dA4FB53cD26614312026"
      note: "USA250Reflector — made by the prototype with USDCLookup as
        `peg` and the symbol USA250. Shares the USDC peg corridor with
        1xUSDC but is a distinct (peg, symbol) family. Deploys on first
        make()/issue()."
      # Signature tokens issued by USA250Reflector against chain-local
      # USDC — see unispring/io/<Name>/.
      signatures:
        - name: "Liberty Dollar"
          address: "0x1776a00f15aAf8a5a420Ba3a48Bf2f06828e2026"
          variant: "0x11c69be1c"

hub:
  name: "Hub"
  description: "Canonical hub token. Vanity address chosen so spokes sort below it
    without salt mining."
  address:
