# Etherscan "Token Update Application Form" submission data.
# Field names mirror the form's exact labels. Per-token entries override
# `defaults`. Fields not applicable to Uniteum (ICO/IEO, private sale,
# burn events) are omitted entirely — paste blank into those form sections.

defaults:
  request_type: "New/First Time Token Update"
  requester_name: "Paul Reinholdtsen"
  requester_email: "team@uniteum.one"
  project_website: "https://uniteum.one"
  project_email: "team@uniteum.one"
  project_sector: ""  # freeform — fill per token if useful
  socials:
    whitepaper: ""
    medium: ""
    github: ""
    reddit: ""
    telegram: ""
    slack: ""
    wechat: ""
    facebook: ""
    linkedin: ""
    twitter: ""
    discord: ""
    bitcointalk: ""
    opensea: ""
  price_data:
    coinmarketcap_ticker: ""
    coingecko_ticker: ""

tokens:
  "0x5e8de60e7b7a00240d49bfdde38c4078da97ce27":
    project_name: "Uniteum 1xETH"
    logo_svg: "https://uniteum.one/assets/images/uniteum-eth.svg"
    description: |
      1:1 ETH mirror minted by the Mimicry prototype on Uniswap V4.
      Single-tick position at tick 0 pegs price inside a hard 1-bp
      corridor [1.0, 1.0001). Fully collateralized by ETH locked in a
      Fountain clone with no decrease-liquidity path. No governance, no
      fees beyond the 0.01% swap fee.

  "0xdd76a7267373b32714fa55c6e28a4c5e3228a17e":
    project_name: "Uniteum 1xUSDC"
    logo_svg: "https://uniteum.one/assets/images/uniteum-usdc.svg"
    description: |
      1:1 USDC mirror minted by a Mimicry clone on Uniswap V4. Single-tick
      V4 position pegs price inside a hard 1-bp corridor against chain-local
      USDC (resolved via USDCLookup, so the clone address is identical on
      every supported chain). No governance, no fees beyond the 0.01% swap
      fee.
