# Unispring contract addresses and function signatures.
# Contracts are not yet deployed — addresses left blank until launch.
# `f` = position in Etherscan's alphabetically-sorted function list.

# Per-contract entries. Each has the same shape: address + optional write/read maps.

fountain:
  name: "Fountain"
  description: "Owns every Unispring V4 position. Forwards swap fees to taker; no
    decrease-liquidity path."
  address: "0x634850E4eA5FFF0C6466DDAA7879725446738Ba9"

manifold:
  name: "Manifold (prototype)"
  description: "Per-(hub, tickLower, tickUpper) clone factory. Calls Fountain to
    seat positions."
  address:

neutrinoSource:
  name: "NeutrinoSource (prototype)"
  description: "Mints a Lepton spoke and hands it to a Manifold clone for funding."
  address:

neutrinoChannel:
  name: "NeutrinoChannel (prototype)"
  description: "Relays a single Coinage.make() call per clone."
  address:

notable:
  name: "Notable (prototype)"
  description: "Two-level factory. The prototype mints clones keyed by
    (original, symbol); each clone issues ERC-20s — one per name —
    pegged 1:1 against its original inside a hard 1-bp corridor. The
    prototype itself is the canonical clone for the native pair, whose
    symbol is resolved at construction from a chain-local IStringLookup
    (\"1xETH\" on mainnet, \"1xMATIC\" on Polygon, etc.)."
  # Notable bytecode differs from Mimicry's, so its CREATE2 address
  # differs too. Address will be filled in after vanity mining + deploy.
  address:
  write:
    "issue(name)":
      f: 1
      description: "Mint a fresh issue ERC-20 with this clone's stored
        (original, symbol) and seat its entire supply as a single-tick V4
        position. Idempotent per name. Callable on the prototype to mint
        native-pair issues, or on any clone to mint issues under that pair."
    "make(original, symbol)":
      f: 2
      description: "Deploy (or return) the deterministic Notable clone for
        (original, symbol). Pass an IAddressLookup as `original` to peg
        against a chain-local token while keeping the same clone address
        across chains. Returns the prototype itself for the native pair."
    "zzInit(original, symbol)":
      f: 3
      description: "Clone initializer. Records (original, symbol) on a
        freshly deployed clone. Restricted to the prototype."
  read:
    "coinage()":
      f: 1
      description: "The Coinage factory used to mint issue ERC-20s."
    "issued(name)":
      f: 2
      description: "Predict the deterministic issue address for `name`
        under this instance's stored (original, symbol)."
    "issued(original, symbol, name)":
      f: 3
      description: "Predict the deterministic issue address for `name`
        under (original, symbol), whether or not the clone is deployed yet."
    "made(original, symbol)":
      f: 4
      description: "Predict the deterministic address (and existence) of a
        clone for (original, symbol) before calling `make`. Returns the
        prototype's own address for the native pair."
    "maxSupply()":
      f: 5
      description: "Raw supply minted for an 18-decimal issue (10^27).
        Issues with fewer decimals scale down by 10× per decimal below 18."
    "original()":
      f: 6
      description: "The original currency every issue minted by this
        instance is pegged against (Currency.wrap(address(0)) for native
        ETH). The prototype's value is native ETH."
    "placer()":
      f: 7
      description: "The Fountain that holds each issue's single-tick
        position and routes its swap fees to the Fountain owner."
    "proto()":
      f: 8
      description: "The prototype instance that acts as the clone factory."
    "symbol()":
      f: 9
      description: "The symbol shared by every issue minted by this
        instance. The prototype resolves its value from a chain-local
        IStringLookup at construction (e.g. \"1xETH\" on mainnet)."
    "version()":
      f: 10
      description: "Contract version string."

  # Known clones. Each entry is itself a (original, symbol) factory whose
  # `issue(name)` mints an issue ERC-20 sharing this symbol and pegged
  # against this original. Addresses will be republished after Notable is
  # deployed — Mimicry-era addresses are stale because Notable's bytecode
  # differs.
  clones:
    1xETH:
      symbol: "1xETH"
      original: "native ETH"
      address:
      note: "On mainnet the prototype itself is the canonical native-pair
        clone — no separate deploy. The pair's symbol is resolved at
        construction from a chain-local IStringLookup (\"1xETH\" on
        mainnet, \"1xMATIC\" on Polygon, etc.)."
      issues:
        - name: "Uniteum 1xETH"
          address:
          permalink: "/unispring/uniteum-1xeth/"
    1xUSDC:
      symbol: "1xUSDC"
      original: "chain-local USDC (resolved via USDCLookup)"
      original_lookup: "USDCLookup"
      original_lookup_address: "0xbF123fB006EDDCF474965e1cb102371da5d392f2"
      address:
      note: "Deployed by the prototype with USDCLookup as `original`, so
        the same clone address resolves on every chain that has a
        USDCLookup."
      issues:
        - name: "Uniteum 1xUSDC"
          address:
          permalink: "/unispring/uniteum-1xusdc/"

hub:
  name: "Hub"
  description: "Canonical hub token. Vanity address chosen so spokes sort below it
    without salt mining."
  address:
